# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage production allowlist into _site
        # Narrowed deployment (canonical cleanup, user condition 8):
        # instead of publishing the entire repo root (path: '.'), copy ONLY the
        # explicit production allowlist into _site/. This is defense-in-depth so
        # that any stray/backend/build-artifact file that ever lands in the repo
        # root is never served publicly. Each copy is guarded by an existence
        # check so a missing optional file does not fail the build.
        run: |
          set -euo pipefail

          # Force a UTF-8 locale for this step. 38 of the ~692 music/ MP3
          # filenames contain non-ASCII characters (curly quotes, em-dashes).
          # The filesystem-walking copy below (cp -R on music/.) copies the
          # real on-disk tree and is byte-safe regardless of locale, but a
          # runner that defaults to the C locale could still mangle these
          # names in shell globbing/word-splitting elsewhere. Pinning UTF-8
          # removes that ambiguity so the 38 non-ASCII tracks are never lost.
          export LC_ALL=C.UTF-8 LANG=C.UTF-8

          rm -rf _site
          mkdir -p _site

          copy_file() {
            # copy_file <relative-path>
            if [ -e "$1" ]; then
              mkdir -p "_site/$(dirname "$1")"
              cp -p "$1" "_site/$1"
            fi
          }

          copy_dir() {
            # copy_dir <relative-dir>
            if [ -d "$1" ]; then
              mkdir -p "_site/$1"
              cp -R "$1/." "_site/$1/"
            fi
          }

          # (a) Root canonical HTML pages
          for f in \
            index.html events.html 40DaysToFreedom.html give.html tools.html \
            journal.html lessons.html scripture-search.html recovery-tracker.html \
            local-radio.html ministry-partnerships.html refined-night.html \
            refined-podcast.html privacy.html terms.html recovery-plan.html \
            court-letter.html document-center.html reference-letter.html \
            resources.html resume-builder.html testimony-builder.html \
            prayer-journal.html pricing.html 404.html; do
            copy_file "$f"
          done

          # (b) Whole content trees (devotionals + lessons, in sitemap)
          copy_dir journal
          copy_dir lessons

          # (c) Asset directories
          #
          # music/ holds ~692 MP3s, 38 of which have non-ASCII filenames
          # (curly quotes, em-dashes). copy_dir uses `cp -R "music/." ...`,
          # which walks the real filesystem tree rather than a git file list,
          # so those escaped-in-git names are copied verbatim. Do NOT replace
          # this with a `git ls-files`-driven copy: git prints non-ASCII paths
          # in quoted octal-escaped form and such a copy would silently drop
          # the 38 tracks. The count guard at the end of this step enforces
          # that every source MP3 reaches _site.
          for d in images ads ids data Batch085 music; do
            copy_dir "$d"
          done

          # (d) All root *.mp3 (NUL-delimited to preserve spaces in filenames)
          find . -maxdepth 1 -type f -name '*.mp3' -print0 \
            | while IFS= read -r -d '' mp3; do
                cp -p "$mp3" "_site/${mp3#./}"
              done

          # (e) JavaScript players
          copy_file radio-player.js
          copy_file refined-radio.js

          # (f) Social / share images
          for f in \
            help-us-save-lives.jpg share-banner.jpg share-banner_1.jpg \
            share-banner_4.jpg share-square.jpg unnamed.jpg \
            refined-podcast-ep1-tiffany.jpg; do
            copy_file "$f"
          done

          # (g) Infra files
          for f in sitemap.xml robots.txt CNAME; do
            copy_file "$f"
          done

          echo "Staged _site contents:"
          find _site -maxdepth 1 | sort

          # Audio-preservation guard (user condition 6).
          # Fail the build if the number of staged music MP3s does not equal
          # the number of source music MP3s. This makes a silent drop of the
          # 38 non-ASCII tracks (or any track) impossible: a locale/copy
          # regression that mangles filenames would change the count and
          # block the deploy instead of serving an incomplete catalog.
          src_music_mp3=$(find music -type f -iname '*.mp3' | wc -l | tr -d ' ')
          site_music_mp3=$(find _site/music -type f -iname '*.mp3' | wc -l | tr -d ' ')
          echo "music mp3 count: source=$src_music_mp3 staged=$site_music_mp3"
          if [ "$src_music_mp3" -ne "$site_music_mp3" ]; then
            echo "::error::music MP3 count mismatch: source=$src_music_mp3 staged=$site_music_mp3 (audio tracks were dropped during staging)"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the explicit production allowlist staged above.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
